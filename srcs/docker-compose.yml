services:
  nginx:
    build: ./requirements/nginx
    image: nginx:1.0
    networks:
      - inception
    container_name: nginx
    ports: 
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q --spider https://localhost:443/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  mariadb:
    build: ./requirements/mariadb
    image: mariadb:1.0
    container_name: mariadb
    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    ports:
      - "3306:3306"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/joflorid/data/mariadb

networks:
  inception:
    name: inception
    driver: bridge
    
